<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <meta
      name="description"
      content="Nocap AI - Advanced misinformation detection system powered by artificial intelligence. Combat fake news with real-time credibility analysis."
    />
    <title>Nocap AI - Misinformation Detection System</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://clerk.accounts.dev" crossorigin>
    <link rel="dns-prefetch" href="https://clerk.accounts.dev">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    
    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/favicon.svg">
    
    <style>
      /* Critical CSS for initial render */
      *{box-sizing:border-box;margin:0;padding:0}
      #root{min-height:100vh;background:#fff}
      body{margin:0;font-family:'Josefin Sans',system-ui,-apple-system,sans-serif}
      .dark #root{background:#000}

      /* Initial loading screen - pure CSS, shows before JS loads */
      #initial-loader{
        position:fixed;inset:0;z-index:9999;
        background:#fff;
        display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        gap:20px;
        transition:opacity 0.3s ease;
      }
      #initial-loader.hide{opacity:0;pointer-events:none;}

      /* Logo dots */
      .loader-logo{
        display:grid;grid-template-columns:1fr 1fr;
        gap:6px;width:36px;height:36px;
      }
      .loader-logo span{
        width:14px;height:14px;
        border-radius:50%;
      }
      .loader-logo span:nth-child(1){background:#0f172a;}
      .loader-logo span:nth-child(2){background:#94a3b8;}
      .loader-logo span:nth-child(3){background:#94a3b8;}
      .loader-logo span:nth-child(4){background:#0f172a;}

      /* Spinner */
      .loader-spinner{
        width:32px;height:32px;
        border:3px solid #e2e8f0;
        border-top-color:#475569;
        border-radius:50%;
        animation:spin 0.8s linear infinite;
      }
      .loader-text{
        font-size:13px;color:#94a3b8;
        letter-spacing:0.05em;
        font-family:'Josefin Sans',system-ui,sans-serif;
      }
      @keyframes spin{to{transform:rotate(360deg)}}

      /* Skeleton header bar */
      .loader-header{
        position:fixed;top:0;left:0;right:0;
        height:64px;background:#fff;
        border-bottom:1px solid #f1f5f9;
        display:flex;align-items:center;
        padding:0 24px;gap:12px;
      }
      .skel{
        background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
        background-size:200% 100%;
        animation:shimmer 1.4s infinite;
        border-radius:8px;
      }
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Pure CSS loader — visible instantly before JS loads -->
    <div id="initial-loader">
      <div class="loader-header">
        <div class="loader-logo">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="skel" style="width:80px;height:16px;"></div>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <div class="skel" style="width:60px;height:32px;"></div>
          <div class="skel" style="width:32px;height:32px;border-radius:50%;"></div>
        </div>
      </div>
      <div class="loader-logo" style="margin-top:32px">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading NoCap AI...</p>
    </div>

    <div id="root"></div>
    <script type="text/javascript" charset="UTF-8" src="//cdn.cookie-script.com/s/be521817655f103c37386f3c8bf92cff.js"></script>
  </body>
</html>
